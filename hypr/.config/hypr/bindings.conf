# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
unbind = SUPER SHIFT, Y
bindd = SUPER SHIFT, Y, YouTube, exec, /home/jrtilak/.local/bin/launch-or-focus-youtube
unbind = SUPER SHIFT, G
bindd = SUPER SHIFT, G, WhatsApp, exec, /home/jrtilak/.local/bin/launch-or-focus-whatsapp
bindd = SUPER SHIFT, T, T3 Code, exec, /home/jrtilak/.local/bin/launch-or-focus-t3-code

# Add extra bindings

# Replace Omarchy's default Mako notification bindings with SwayNC.
unbind = SUPER, COMMA
unbind = SUPER SHIFT, COMMA
unbind = SUPER CTRL, COMMA
unbind = SUPER ALT, COMMA
unbind = SUPER SHIFT ALT, COMMA
bindd = SUPER, COMMA, Dismiss latest notification, exec, swaync-client --close-latest --skip-wait
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, swaync-client --close-all --skip-wait
bindd = SUPER CTRL, COMMA, Toggle notification DND, exec, sh -c 'swaync-client --toggle-dnd --skip-wait && pkill -RTMIN+10 waybar'
bindd = SUPER ALT, COMMA, Open notification center, exec, swaync-client --toggle-panel --skip-wait
bindd = SUPER SHIFT ALT, COMMA, Restore notification center, exec, swaync-client --open-panel --skip-wait

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

