$line_break\
╰─$jobs\
$status\
$character\
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[fill]
symbol = "─"
style = "bright-black"

[aws]
symbol = " "
format = "\\[[$symbol($profile)(\\($region\\))(\\[$duration\\])]($style)\\]"

[azure]
symbol = " "
format = "\\[[$symbol($subscription)]($style)\\]"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
format = "\\[[$symbol$percentage]($style)\\]"
disabled = false

[[battery.display]]
threshold = 100
style = "bold green"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 10
style = "bold red"


[buf]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[bun]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[c]
symbol = " "
format = "\\[[$symbol($version(-$name))]($style)\\]"

[cpp]
symbol = " "
format = "\\[[$symbol($version(-$name))]($style)\\]"

[cmake]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[cobol]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[conda]
symbol = " "
format = "\\[[$symbol$environment]($style)\\]"

[container]
symbol = " "
format = "\\[[$symbol \\[$name\\]]($style)\\]"

[crystal]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[dart]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[deno]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[direnv]
symbol = " "
format = "\\[[$symbol$loaded/$allowed]($style)\\]"

[directory]
read_only = " 󰌾"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"


[docker_context]
symbol = " "
format = "\\[[$symbol$context]($style)\\]"

[dotnet]
symbol = " "
format = "\\[[$symbol($version)(🎯 $tfm)]($style)\\]"

[elixir]
symbol = " "
format = "\\[[$symbol($version \\(OTP $otp_version\\))]($style)\\]"

[elm]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[erlang]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[fennel]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[fortran]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[fossil_branch]
symbol = " "
format = "\\[[$symbol$branch]($style)\\]"

[gcloud]
symbol = "󱇶 "
format = "\\[[$symbol$account(@$domain)(\\($region\\))]($style)\\]"

[gleam]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[git_branch]
symbol = " "
format = "\\[[$symbol$branch]($style)\\]"

[git_commit]
tag_symbol = "  "
format = "\\[[\\($hash$tag\\)]($style)\\]"

[golang]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

[gradle]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

