source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = true
}

label {
    monitor =
    text = cmd[update:30000] sh -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); if [ -z "$cap" ]; then echo "󰚥"; elif [ "$status" = "Charging" ]; then echo "󰂄"; elif [ "$cap" -ge 90 ]; then echo "󰁹"; elif [ "$cap" -ge 70 ]; then echo "󰂁"; elif [ "$cap" -ge 40 ]; then echo "󰁾"; elif [ "$cap" -ge 20 ]; then echo "󰁻"; else echo "󰂎"; fi'
    color = $font_color
    font_size = 16
    font_family = Iosevka Nerd Font

    position = -76, -20
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] sh -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); if [ -z "$cap" ]; then echo "AC"; else echo "${cap}%"; fi'
    color = $font_color
    font_size = 16
    font_family = Outfit

    position = -24, -20
    halign = right
    valign = top
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 82
    font_family = Outfit

    position = 0, -44
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%a, %d %b"
    color = $placeholder_color
    font_size = 18
    font_family = Outfit

    position = 0, -188
    halign = center
    valign = top
}

image {
    monitor =
    path = ~/.face
    size = 72
    rounding = -1
    border_size = 3
    border_color = $outer_color

    position = 0, 16
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] sh -c 'printf "%s@%s" "$(hostname)" "$USER"'
    color = $font_color
    font_size = 18
    font_family = Outfit

    position = 0, -54
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    position = 0, -116
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 1

    font_family = Outfit
    font_color = $placeholder_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 8
    shadow_passes = 0
    fade_on_empty = false
}

shape {
    monitor =
    size = 74, 72
    color = rgba(0, 0, 0, 0.0)
    border_size = 0
    rounding = 8
    onclick = systemctl suspend

    position = -82, -208
    halign = center
    valign = center
}

shape {
    monitor =
    size = 86, 72
    color = rgba(0, 0, 0, 0.0)
    border_size = 0
    rounding = 8
    onclick = systemctl hibernate

    position = 0, -208
    halign = center
    valign = center
}

shape {
    monitor =
    size = 86, 72
    color = rgba(0, 0, 0, 0.0)
    border_size = 0
    rounding = 8
    onclick = systemctl poweroff

    position = 82, -208
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰒲
    color = $font_color
    font_size = 20
    font_family = Iosevka Nerd Font
    onclick = systemctl suspend

    position = -82, -192
    halign = center
    valign = center
}

label {
    monitor =
    text = Sleep
    color = $font_color
    font_size = 9
    font_family = Outfit
    onclick = systemctl suspend

    position = -82, -224
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰤄
    color = $font_color
    font_size = 20
    font_family = Iosevka Nerd Font
    onclick = systemctl hibernate

    position = 0, -192
    halign = center
    valign = center
}

label {
    monitor =
    text = Hibernate
    color = $font_color
    font_size = 9
    font_family = Outfit
    onclick = systemctl hibernate

    position = 0, -224
    halign = center
    valign = center
}

label {
    monitor =
    text = ⏻
    color = $font_color
    font_size = 20
    font_family = Iosevka Nerd Font
    onclick = systemctl poweroff

    position = 82, -192
    halign = center
    valign = center
}

label {
    monitor =
    text = Shutdown
    color = $font_color
    font_size = 9
    font_family = Outfit
    onclick = systemctl poweroff

    position = 82, -224
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = false
}
