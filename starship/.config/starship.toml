format = "\\[[$symbol($version)]($style)\\]"

[openstack]
symbol = " "
format = "\\[[$symbol$cloud(\\($project\\))]($style)\\]"

[os]
format = "\\[[$symbol]($style)\\]"
disabled = false

[os.symbols]
AIX = " "
